# version: '3.8'
services:
  # Application
  app:
    build:
      context: .
      dockerfile: ./docker/app/Dockerfile
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - 'database'
  # Web Server
  nginx:
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - 'app'
    ports:
      - 80:80
  # Database MySQL
  # database:
  #     image: mysql:8.4.3
  #     restart: no
  #     volumes:
  #         - dbdata:/var/lib/mysql:rw
  #         - ./docker/mysql/my.cnf:/etc/mysql/mysql.conf.d/mysqld.cnf
  #     environment:
  #         MYSQL_DATABASE: ${DB_DATABASE}
  #         MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
  #         MYSQL_PASSWORD: ${DB_PASSWORD}
  #         MYSQL_USER: ${DB_USERNAME}
  #     ports:
  #         - 3306:3306
  #     expose:
  #         - 3306
  # Database PostgreSQL
  database:
    image: kartoza/postgis
    volumes:
      - dbdata:/var/lib/postgresql
    ports:
      - 25432:5432
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASS=${DB_PASSWORD}
      - ALLOW_IP_RANGE=0.0.0.0/0
      # trust
      - POSTGRES_TRUST_LOCALNET=true
      # Add extensions you need to be enabled by default in the DB.  Default are the five specified below
      - POSTGRES_MULTIPLE_EXTENSIONS=postgis,hstore,postgis_topology,postgis_raster,pgrouting
      - RUN_AS_ROOT=true
    restart: no
    healthcheck:
      test: 'PGPASSWORD=${DB_PASSWORD} pg_isready -h 127.0.0.1 -U ${DB_USERNAME} -d postgres'
  # Database management
  # pma:
  #     image: phpmyadmin:5.1
  #     environment:
  #         - PMA_ARBITRARY=1
  #         - PMA_HOST=${DB_HOST}
  #         - PMA_USER=${DB_USERNAME}
  #         - PMA_PASSWORD=${DB_PASSWORD}
  #         - PMA_PORT=${DB_PORT}
  #     depends_on:
  #         - database
  #     ports:
  #         - 8888:80
  # Mailing Server
  # mailhog:
  #     image: mailhog/mailhog
  #     logging:
  #         driver: 'none'
  #     ports:
  #         - 1025:1025
  #         - 8025:8025
  #     expose:
  #         - 1025
  #         - 8025
  #     restart: no
volumes:
  dbdata:
